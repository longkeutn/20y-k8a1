<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Nền Deep Royal Navy bo tròn maskable -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Vòng tròn vàng kim mạ kép -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="12, 6" opacity="0.6" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldShadow)" />

  <!-- Vương miện danh dự đỉnh -->
  <path d="M 216 130 L 236 150 L 256 120 L 276 150 L 296 130 L 286 165 L 226 165 Z" fill="url(#goldGrad)" />
  <circle cx="216" cy="125" r="4" fill="#FEF3C7" />
  <circle cx="256" cy="115" r="5" fill="#FEF3C7" />
  <circle cx="296" cy="125" r="4" fill="#FEF3C7" />

  <!-- Chữ K8A1 nổi bật -->
  <text x="256" y="270" font-family="'Playfair Display', serif, Arial" font-size="96" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#goldShadow)">K8A1</text>

  <!-- Banner 20 NĂM NGÀY TRỞ VỀ -->
  <rect x="116" y="300" width="280" height="42" rx="21" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="256" y="328" font-family="'Plus Jakarta Sans', sans-serif, Arial" font-size="20" font-weight="800" fill="#FEF3C7" text-anchor="middle" letter-spacing="3">20 NĂM NGÀY TRỞ VỀ</text>

  <!-- Phụ đề niên khóa & trường -->
  <text x="256" y="375" font-family="'Plus Jakarta Sans', sans-serif, Arial" font-size="16" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2">THPT THÁI NGUYÊN • 2003 - 2006</text>
  
  <!-- Ngôi sao vàng kim đáy -->
  <text x="256" y="420" font-size="24" fill="url(#goldGrad)" text-anchor="middle">★ ★ ★</text>
</svg>
